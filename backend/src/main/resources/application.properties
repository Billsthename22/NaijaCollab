spring.application.name=backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/naijacollab}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.group.readiness.include=db,ping
management.endpoint.health.group.liveness.include=ping
management.health.db.enabled=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app.security.jwt-secret=${APP_JWT_SECRET:change-me-at-least-32-characters-long-secret}
app.security.access-token-ttl=15m
app.security.refresh-token-ttl=7d
app.security.issuer=naijacollab-backend
app.security.access-cookie-name=nc_access_token
app.security.refresh-cookie-name=nc_refresh_token
app.security.secure-cookies=false
app.security.cors-allowed-origins[0]=http://localhost:3000
logging.pattern.level=%5p [corr:%X{correlationId:-}]
