spring.datasource.url=jdbc:h2:mem:naijacollab;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

app.security.jwt-secret=local-dev-secret-key-at-least-32-characters-long
logging.pattern.level=%5p [corr:%X{correlationId:-}]
